# Infraestructura local de desarrollo de UML Forge.
# Arranque: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: uml-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umlforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umlforge}
      POSTGRES_DB: ${POSTGRES_DB:-umlforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-umlforge} -d ${POSTGRES_DB:-umlforge}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: uml-forge-postgres-data
