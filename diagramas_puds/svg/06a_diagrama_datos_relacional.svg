<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 820" width="1520" height="820">
  <defs>
    <style>
      .ea-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: bold; fill: #1B365D; }
      .ea-subtitle { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; fill: #4A6B82; }
      .ea-meta-lbl { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }
      .ea-meta-val { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; fill: #1E293B; }
      .ea-actor-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #17202A; text-anchor: middle; }
      .ea-actor-role { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #5D6D7E; font-style: italic; text-anchor: middle; }
      .ea-uc-code { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #20638F; text-anchor: middle; }
      .ea-uc-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1A252F; text-anchor: middle; }
      .ea-uc-sub { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #4A5568; text-anchor: middle; }
      .ea-edge-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #2C3E50; text-anchor: middle; }
      .ea-boundary-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #2C3E50; }
    </style>
    
    <!-- Flechas y Conectores EA -->
    <marker id="ea-open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#2C3E50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="1 1, 11 6, 1 11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-composition" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#2C3E50" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
    <marker id="ea-aggregation" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Fondo Lienzo Blanco -->
  <rect width="1520" height="820" fill="#FFFFFF" />

  <!-- Marco Exterior de Diagrama Enterprise Architect -->
  <rect x="20" y="20" width="1480" height="780" fill="none" stroke="#708090" stroke-width="1.2" stroke-dasharray="none"/>

  <!-- Bloque de Título Oficial EA (Esquina superior izquierda ampliada) -->
  <g id="ea-diagram-header">
    <!-- Pestaña de tipo de diagrama -->
    <rect x="20" y="18" width="110" height="22" fill="#F0F4F8" stroke="#708090" stroke-width="1"/>
    <text x="75.0" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">database</text>
    
    <!-- Caja principal de metadatos generosa -->
    <rect x="20" y="40" width="655" height="68" fill="#FAFCFE" stroke="#708090" stroke-width="1.2"/>
    
    <!-- Línea 1: Título completo protegido sin desbordes -->
    <text x="34" y="61" class="ea-title">Diagrama de Datos Relacional: Esquema Físico PostgreSQL 16</text>
    
    <!-- Línea 2: Nombre del Paquete PUDS -->
    <text x="34" y="79" class="ea-subtitle">Paquete: Modelo de Persistencia Relacional [PUDS_MDF_01]</text>
    
    <!-- Línea 3: Metadatos EA ordenados con amplio espacio -->
    <text x="34" y="97" class="ea-meta-lbl">Autor: <tspan class="ea-meta-val">Equipo UML Forge</tspan></text>
    <text x="210" y="97" class="ea-meta-lbl">Fecha: <tspan class="ea-meta-val">18/09/2026</tspan></text>
    <text x="360" y="97" class="ea-meta-lbl">Versión: <tspan class="ea-meta-val">1.0</tspan></text>
    <text x="470" y="97" class="ea-meta-lbl">Estado: <tspan class="ea-meta-val">Approved</tspan></text>
  </g>

  <!-- Table: users -->
  <g id="table-users">
    <rect x="60" y="140" width="340" height="207" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    <rect x="60" y="140" width="340" height="44" fill="#E8F4F8" stroke="#2C3E50" stroke-width="1.2"/>
    <text x="230.0" y="156" font-family="'Segoe UI', Arial" font-size="9.5" fill="#4A6B82" text-anchor="middle">«table»</text>
    <text x="230.0" y="173" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1B365D" text-anchor="middle">User (users)</text>
    <line x1="60" y1="184" x2="400" y2="184" stroke="#2C3E50" stroke-width="1"/>
    <text x="72" y="199" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">PK  id : uuid NOT NULL</text>
    <text x="72" y="217" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">UK  email : varchar(255) NOT NULL</text>
    <text x="72" y="235" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    password_hash : varchar(255) NOT NULL</text>
    <text x="72" y="253" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    name : varchar(100) NOT NULL</text>
    <text x="72" y="271" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    role : varchar(20) DEFAULT &#x27;USER&#x27;</text>
    <text x="72" y="289" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    created_at : timestamptz NOT NULL</text>
    <text x="72" y="307" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    updated_at : timestamptz NOT NULL</text>
    <line x1="60" y1="320" x2="400" y2="320" stroke="#2C3E50" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="72" y="334" font-family="'Segoe UI', Arial" font-size="9.5" fill="#5D6D7E" font-style="italic">idx_users_email (UNIQUE)</text>
  </g>

  <!-- Table: refresh_tokens -->
  <g id="table-refresh_tokens">
    <rect x="500" y="140" width="340" height="224" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    <rect x="500" y="140" width="340" height="44" fill="#E8F4F8" stroke="#2C3E50" stroke-width="1.2"/>
    <text x="670.0" y="156" font-family="'Segoe UI', Arial" font-size="9.5" fill="#4A6B82" text-anchor="middle">«table»</text>
    <text x="670.0" y="173" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1B365D" text-anchor="middle">RefreshToken (refresh_tokens)</text>
    <line x1="500" y1="184" x2="840" y2="184" stroke="#2C3E50" stroke-width="1"/>
    <text x="512" y="199" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">PK  id : uuid NOT NULL</text>
    <text x="512" y="217" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    token_hash : varchar(255) NOT NULL</text>
    <text x="512" y="235" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">FK  user_id : uuid NOT NULL</text>
    <text x="512" y="253" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    family_id : uuid NOT NULL</text>
    <text x="512" y="271" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    expires_at : timestamptz NOT NULL</text>
    <text x="512" y="289" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    revoked : boolean DEFAULT false</text>
    <text x="512" y="307" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    created_at : timestamptz NOT NULL</text>
    <line x1="500" y1="320" x2="840" y2="320" stroke="#2C3E50" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="512" y="334" font-family="'Segoe UI', Arial" font-size="9.5" fill="#5D6D7E" font-style="italic">idx_rf_user_id (btree)</text>
    <text x="512" y="351" font-family="'Segoe UI', Arial" font-size="9.5" fill="#5D6D7E" font-style="italic">idx_rf_family_id (btree)</text>
  </g>

  <!-- Table: projects -->
  <g id="table-projects">
    <rect x="60" y="480" width="340" height="189" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    <rect x="60" y="480" width="340" height="44" fill="#E8F4F8" stroke="#2C3E50" stroke-width="1.2"/>
    <text x="230.0" y="496" font-family="'Segoe UI', Arial" font-size="9.5" fill="#4A6B82" text-anchor="middle">«table»</text>
    <text x="230.0" y="513" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1B365D" text-anchor="middle">Project (projects)</text>
    <line x1="60" y1="524" x2="400" y2="524" stroke="#2C3E50" stroke-width="1"/>
    <text x="72" y="539" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">PK  id : uuid NOT NULL</text>
    <text x="72" y="557" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    name : varchar(150) NOT NULL</text>
    <text x="72" y="575" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    description : text</text>
    <text x="72" y="593" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">FK  owner_id : uuid NOT NULL</text>
    <text x="72" y="611" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    created_at : timestamptz NOT NULL</text>
    <text x="72" y="629" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    updated_at : timestamptz NOT NULL</text>
    <line x1="60" y1="642" x2="400" y2="642" stroke="#2C3E50" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="72" y="656" font-family="'Segoe UI', Arial" font-size="9.5" fill="#5D6D7E" font-style="italic">idx_projects_owner_id (btree)</text>
  </g>

  <!-- Table: ydoc_states -->
  <g id="table-ydoc_states">
    <rect x="500" y="480" width="340" height="189" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    <rect x="500" y="480" width="340" height="44" fill="#E8F4F8" stroke="#2C3E50" stroke-width="1.2"/>
    <text x="670.0" y="496" font-family="'Segoe UI', Arial" font-size="9.5" fill="#4A6B82" text-anchor="middle">«table»</text>
    <text x="670.0" y="513" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1B365D" text-anchor="middle">YDocState (ydoc_states)</text>
    <line x1="500" y1="524" x2="840" y2="524" stroke="#2C3E50" stroke-width="1"/>
    <text x="512" y="539" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">PK  id : uuid NOT NULL</text>
    <text x="512" y="557" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">FK  project_id : uuid NOT NULL</text>
    <text x="512" y="575" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">UK  project_id : uuid (UNIQUE 1:1)</text>
    <text x="512" y="593" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    data : bytea NOT NULL</text>
    <text x="512" y="611" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    version : integer DEFAULT 1</text>
    <text x="512" y="629" font-family="'Segoe UI', Consolas, Arial" font-size="10.5" fill="#1E293B">    updated_at : timestamptz NOT NULL</text>
    <line x1="500" y1="642" x2="840" y2="642" stroke="#2C3E50" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="512" y="656" font-family="'Segoe UI', Arial" font-size="9.5" fill="#5D6D7E" font-style="italic">idx_ydoc_project_id (UNIQUE)</text>
  </g>
  <line x1="400" y1="230" x2="500" y2="230" stroke="#2C3E50" stroke-width="1.2"  marker-start="url(#ea-composition)" />
  <g>
    <rect x="415.0" y="211" width="18" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="424" y="223" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">1</text>
  </g>
  <g>
    <rect x="458.0" y="211" width="36" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="476" y="223" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">0..*</text>
  </g>
  <g>
    <rect x="388.0" y="221.0" width="124.0" height="18" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="450.0" y="234.0" class="ea-edge-label">posee (CASCADE)</text>
  </g>
  <line x1="230" y1="347" x2="230" y2="480" stroke="#2C3E50" stroke-width="1.2"  marker-start="url(#ea-composition)" />
  <g>
    <rect x="239.0" y="356" width="18" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="248" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">1</text>
  </g>
  <g>
    <rect x="230.0" y="453" width="36" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="248" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">0..*</text>
  </g>
  <g>
    <rect x="171.6" y="404.5" width="116.8" height="18" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="230.0" y="417.5" class="ea-edge-label">crea (CASCADE)</text>
  </g>
  <line x1="400" y1="570" x2="500" y2="570" stroke="#2C3E50" stroke-width="1.2"  marker-start="url(#ea-composition)" />
  <g>
    <rect x="415.0" y="551" width="18" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="424" y="563" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">1</text>
  </g>
  <g>
    <rect x="467.0" y="551" width="18" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text x="476" y="563" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">1</text>
  </g>
  <g>
    <rect x="362.8" y="561.0" width="174.4" height="18" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="450.0" y="574.0" class="ea-edge-label">almacena (1:1 CASCADE)</text>
  </g>

  <!-- EA Note -->
  <g id="ea-note">
    <path d="M 910 140 L 1458 140 L 1470 152 L 1470 600 L 910 600 Z" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
    <path d="M 1458 140 L 1458 152 L 1470 152 Z" fill="#FFF59D" stroke="#F9A825" stroke-width="1"/>
    <text x="920" y="160" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Reglas de Integridad Relacional (Prisma 7 / PostgreSQL 16):</text>
    <text x="920" y="176" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F"></text>
    <text x="920" y="192" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">1. Claves Primarias: UUID v4 generadas criptográficamente.</text>
    <text x="920" y="208" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">2. Unicidad Estricta: Correos normalizados en minúsculas (UK).</text>
    <text x="920" y="224" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">3. Integridad Referencial en Cascada (ON DELETE CASCADE):</text>
    <text x="920" y="240" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   - La eliminación de &#x27;users&#x27; purga automáticamente sus</text>
    <text x="920" y="256" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">     &#x27;refresh_tokens&#x27; y sus &#x27;projects&#x27;.</text>
    <text x="920" y="272" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   - La eliminación de &#x27;projects&#x27; purga su &#x27;ydoc_states&#x27;.</text>
    <text x="920" y="288" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">4. Relación 1:1 Estricta: &#x27;projects&#x27; a &#x27;ydoc_states&#x27; garantizada</text>
    <text x="920" y="304" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   mediante índice UNIQUE sobre project_id.</text>
    <text x="920" y="320" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">5. Almacenamiento CRDT Binario: Columna &#x27;data&#x27; de tipo BYTEA</text>
    <text x="920" y="336" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   para optimizar la persistencia del vector Yjs sin serializar JSON.</text>
    <text x="920" y="352" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">6. Detección de Robo de Token (Token Theft Detection ADR-0013):</text>
    <text x="920" y="368" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   - Las familias de tokens agrupan sesiones.</text>
    <text x="920" y="384" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">   - Reutilizar un token revocado anula toda la familia.</text>
    <text x="920" y="400" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">7. Auditoría Automática: Timestamps &#x27;created_at&#x27; y &#x27;updated_at&#x27;.</text>
  </g>

</svg>