<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800">
  <defs>
    <style>
      .ea-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: bold; fill: #1B365D; }
      .ea-subtitle { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; fill: #4A6B82; }
      .ea-meta-lbl { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }
      .ea-meta-val { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; fill: #1E293B; }
      .ea-actor-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #17202A; text-anchor: middle; }
      .ea-actor-role { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #5D6D7E; font-style: italic; text-anchor: middle; }
      .ea-uc-code { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #20638F; text-anchor: middle; }
      .ea-uc-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1A252F; text-anchor: middle; }
      .ea-uc-sub { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #4A5568; text-anchor: middle; }
      .ea-edge-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #2C3E50; text-anchor: middle; }
      .ea-boundary-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #2C3E50; }
    </style>
    
    <!-- Flechas y Conectores EA -->
    <marker id="ea-open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#2C3E50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="1 1, 11 6, 1 11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-composition" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#2C3E50" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
    <marker id="ea-aggregation" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Fondo Lienzo Blanco -->
  <rect width="1240" height="800" fill="#FFFFFF" />

  <!-- Marco Exterior de Diagrama Enterprise Architect -->
  <rect x="20" y="20" width="1200" height="760" fill="none" stroke="#708090" stroke-width="1.2" stroke-dasharray="none"/>

  <!-- Bloque de Título Oficial EA (Esquina superior izquierda ampliada) -->
  <g id="ea-diagram-header">
    <!-- Pestaña de tipo de diagrama -->
    <rect x="20" y="18" width="110" height="22" fill="#F0F4F8" stroke="#708090" stroke-width="1"/>
    <text x="75.0" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">usecase</text>
    
    <!-- Caja principal de metadatos generosa -->
    <rect x="20" y="40" width="757" height="68" fill="#FAFCFE" stroke="#708090" stroke-width="1.2"/>
    
    <!-- Línea 1: Título completo protegido sin desbordes -->
    <text x="34" y="61" class="ea-title">Diagrama de Casos de Uso: Colaboración en Tiempo Real y Modo Offline</text>
    
    <!-- Línea 2: Nombre del Paquete PUDS -->
    <text x="34" y="79" class="ea-subtitle">Paquete: Paquete 4: Colaboración y Resiliencia [PUDS_CU_05]</text>
    
    <!-- Línea 3: Metadatos EA ordenados con amplio espacio -->
    <text x="34" y="97" class="ea-meta-lbl">Autor: <tspan class="ea-meta-val">Equipo UML Forge</tspan></text>
    <text x="210" y="97" class="ea-meta-lbl">Fecha: <tspan class="ea-meta-val">18/09/2026</tspan></text>
    <text x="360" y="97" class="ea-meta-lbl">Versión: <tspan class="ea-meta-val">1.0</tspan></text>
    <text x="470" y="97" class="ea-meta-lbl">Estado: <tspan class="ea-meta-val">Approved</tspan></text>
  </g>

  <!-- System Boundary: Subsystem: Colaboración Concurrente y Resiliencia -->
  <g id="system-boundary">
    <rect x="250" y="116" width="710" height="644" fill="#FCFDFE" stroke="#7A8B99" stroke-width="1.2" stroke-dasharray="none"/>
    <rect x="250" y="116" width="280" height="24" fill="#E8EFF5" stroke="#7A8B99" stroke-width="1.2"/>
    <text x="262" y="132" class="ea-boundary-title">Subsystem: Colaboración Concurrente y Resiliencia</text>
  </g>

  <!-- Actor: Modelador Local -->
  <g id="actor-modelador-local">
    <!-- Cabeza -->
    <circle cx="120" cy="231" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="120" y1="242" x2="120" y2="272" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="102" y1="255" x2="138" y2="255" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="120" y1="272" x2="105" y2="294" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="120" y1="272" x2="135" y2="294" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="120" y="310" class="ea-actor-name">Modelador Local</text>    <text x="120" y="323" class="ea-actor-role">Sesión de Trabajo</text>
  </g>

  <!-- Actor: Colaborador Remoto -->
  <g id="actor-colaborador-remoto">
    <!-- Cabeza -->
    <circle cx="120" cy="511" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="120" y1="522" x2="120" y2="552" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="102" y1="535" x2="138" y2="535" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="120" y1="552" x2="105" y2="574" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="120" y1="552" x2="135" y2="574" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="120" y="590" class="ea-actor-name">Colaborador Remoto</text>    <text x="120" y="603" class="ea-actor-role">Sesión Concurrente</text>
  </g>

  <!-- Actor: Servidor Hocuspocus -->
  <g id="actor-servidor-hocuspocus">
    <!-- Cabeza -->
    <circle cx="1100" cy="231" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="1100" y1="242" x2="1100" y2="272" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="1082" y1="255" x2="1118" y2="255" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="1100" y1="272" x2="1085" y2="294" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="1100" y1="272" x2="1115" y2="294" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="1100" y="308" font-family="'Segoe UI', Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">«system»</text>    <text x="1100" y="320" class="ea-actor-name">Servidor Hocuspocus</text>    <text x="1100" y="333" class="ea-actor-role">WebSocket CRDT Yjs</text>
  </g>

  <!-- Actor: Almacén IndexedDB -->
  <g id="actor-almacén-indexeddb">
    <!-- Cabeza -->
    <circle cx="1100" cy="511" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="1100" y1="522" x2="1100" y2="552" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="1082" y1="535" x2="1118" y2="535" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="1100" y1="552" x2="1085" y2="574" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="1100" y1="552" x2="1115" y2="574" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="1100" y="588" font-family="'Segoe UI', Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">«system»</text>    <text x="1100" y="600" class="ea-actor-name">Almacén IndexedDB</text>    <text x="1100" y="613" class="ea-actor-role">Base de Datos Local PWA</text>
  </g>

  <!-- Use Case: CU-27 Unirse a Sesión en Vivo -->
  <g id="uc-cu-27">
    <ellipse cx="430" cy="220" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="208" class="ea-uc-code">CU-27</text>
    <text x="430" y="224" class="ea-uc-name">Unirse a Sesión en Vivo</text>
    <text x="430" y="238" class="ea-uc-name">Conexión WebSocket Autenticada</text>
  </g>

  <!-- Use Case: CU-29 Sincronizar Cambios (CRDT) -->
  <g id="uc-cu-29">
    <ellipse cx="430" cy="360" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="348" class="ea-uc-code">CU-29</text>
    <text x="430" y="364" class="ea-uc-name">Sincronizar Cambios (CRDT)</text>
    <text x="430" y="378" class="ea-uc-name">Consistencia Fuerte Libre de Conflictos</text>
  </g>

  <!-- Use Case: CU-30 Detectar Pérdida de Conexión -->
  <g id="uc-cu-30">
    <ellipse cx="430" cy="520" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="508" class="ea-uc-code">CU-30</text>
    <text x="430" y="524" class="ea-uc-name">Detectar Pérdida de Conexión</text>
    <text x="430" y="538" class="ea-uc-name">Transición Transparente a Modo Offline</text>
  </g>

  <!-- Use Case: CU-32 Reconciliar y Drenar Outbox -->
  <g id="uc-cu-32">
    <ellipse cx="430" cy="670" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="658" class="ea-uc-code">CU-32</text>
    <text x="430" y="674" class="ea-uc-name">Reconciliar y Drenar Outbox</text>
    <text x="430" y="688" class="ea-uc-name">Sincronización al Restablecer Red</text>
  </g>

  <!-- Use Case: CU-28 Difundir Presencia y Cursores -->
  <g id="uc-cu-28">
    <ellipse cx="780" cy="220" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="780" y="208" class="ea-uc-code">CU-28</text>
    <text x="780" y="224" class="ea-uc-name">Difundir Presencia y Cursores</text>
    <text x="780" y="238" class="ea-uc-name">Awareness de Usuarios Remotos</text>
  </g>

  <!-- Use Case: CU-31 Encolar en Outbox Local -->
  <g id="uc-cu-31">
    <ellipse cx="780" cy="520" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="780" y="508" class="ea-uc-code">CU-31</text>
    <text x="780" y="524" class="ea-uc-name">Encolar en Outbox Local</text>
    <text x="780" y="538" class="ea-uc-name">Garantía de Persistencia en IndexedDB</text>
  </g>
  <line x1="145" y1="250" x2="315" y2="220" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="270" x2="315" y2="360" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="530" x2="315" y2="360" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="550" x2="315" y2="520" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="560" x2="315" y2="670" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="545" y1="220" x2="665" y2="220" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <g>
    <rect x="564.25" y="211.0" width="81.5" height="18" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="605.0" y="224.0" class="ea-edge-label">«include»</text>
  </g>
  <line x1="545" y1="520" x2="665" y2="520" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <g>
    <rect x="564.25" y="511.0" width="81.5" height="18" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="605.0" y="524.0" class="ea-edge-label">«include»</text>
  </g>
  <line x1="780" y1="549" x2="545" y2="670" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <g>
    <rect x="625.5" y="600.5" width="74.0" height="18" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="662.5" y="613.5" class="ea-edge-label">«extend»</text>
  </g>
  <line x1="545" y1="230" x2="1075" y2="250" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="545" y1="360" x2="1075" y2="270" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="895" y1="220" x2="1075" y2="260" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="895" y1="520" x2="1075" y2="535" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="545" y1="670" x2="1075" y2="550" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>

  <!-- EA Note -->
  <g id="ea-note">
    <path d="M 880 40 L 1198 40 L 1210 52 L 1210 95 L 880 95 Z" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
    <path d="M 1198 40 L 1198 52 L 1210 52 Z" fill="#FFF59D" stroke="#F9A825" stroke-width="1"/>
    <text x="890" y="60" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Resiliencia Local-First (ADR 0021 / ADR 0026):</text>
    <text x="890" y="76" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">IndexedDB respalda el estado local ante caídas.</text>
    <text x="890" y="92" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Algoritmo Yjs garantiza convergencia sin bloqueos.</text>
  </g>

</svg>