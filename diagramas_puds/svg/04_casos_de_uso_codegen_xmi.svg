<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 780" width="1220" height="780">
  <defs>
    <style>
      .ea-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: bold; fill: #1B365D; }
      .ea-subtitle { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; fill: #4A6B82; }
      .ea-meta-lbl { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }
      .ea-meta-val { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; fill: #1E293B; }
      .ea-actor-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #17202A; text-anchor: middle; }
      .ea-actor-role { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #5D6D7E; font-style: italic; text-anchor: middle; }
      .ea-uc-code { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #20638F; text-anchor: middle; }
      .ea-uc-name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1A252F; text-anchor: middle; }
      .ea-uc-sub { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #4A5568; text-anchor: middle; }
      .ea-edge-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #2C3E50; text-anchor: middle; }
      .ea-boundary-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #2C3E50; }
    </style>
    
    <!-- Flechas y Conectores EA -->
    <marker id="ea-open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#2C3E50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="1 1, 11 6, 1 11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="ea-composition" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#2C3E50" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
    <marker id="ea-aggregation" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="7" orient="auto">
      <polygon points="1 5, 7 1.5, 13 5, 7 8.5" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Fondo Lienzo Blanco -->
  <rect width="1220" height="780" fill="#FFFFFF" />

  <!-- Marco Exterior de Diagrama Enterprise Architect -->
  <rect x="20" y="20" width="1180" height="740" fill="none" stroke="#708090" stroke-width="1.2" stroke-dasharray="none"/>

  <!-- Bloque de Título Oficial EA (Esquina superior izquierda ampliada) -->
  <g id="ea-diagram-header">
    <!-- Pestaña de tipo de diagrama -->
    <rect x="20" y="18" width="110" height="22" fill="#F0F4F8" stroke="#708090" stroke-width="1"/>
    <text x="75.0" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1B365D" text-anchor="middle">usecase</text>
    
    <!-- Caja principal de metadatos generosa -->
    <rect x="20" y="40" width="757" height="68" fill="#FAFCFE" stroke="#708090" stroke-width="1.2"/>
    
    <!-- Línea 1: Título completo protegido sin desbordes -->
    <text x="34" y="61" class="ea-title">Diagrama de Casos de Uso: Síntesis de Código e Interoperabilidad XMI</text>
    
    <!-- Línea 2: Nombre del Paquete PUDS -->
    <text x="34" y="79" class="ea-subtitle">Paquete: Paquete 3: Generación e Interoperabilidad [PUDS_CU_04]</text>
    
    <!-- Línea 3: Metadatos EA ordenados con amplio espacio -->
    <text x="34" y="97" class="ea-meta-lbl">Autor: <tspan class="ea-meta-val">Equipo UML Forge</tspan></text>
    <text x="210" y="97" class="ea-meta-lbl">Fecha: <tspan class="ea-meta-val">18/09/2026</tspan></text>
    <text x="360" y="97" class="ea-meta-lbl">Versión: <tspan class="ea-meta-val">1.0</tspan></text>
    <text x="470" y="97" class="ea-meta-lbl">Estado: <tspan class="ea-meta-val">Approved</tspan></text>
  </g>

  <!-- System Boundary: Subsystem: Síntesis de Backend y Puente CASE XMI -->
  <g id="system-boundary">
    <rect x="250" y="116" width="700" height="624" fill="#FCFDFE" stroke="#7A8B99" stroke-width="1.2" stroke-dasharray="none"/>
    <rect x="250" y="116" width="280" height="24" fill="#E8EFF5" stroke="#7A8B99" stroke-width="1.2"/>
    <text x="262" y="132" class="ea-boundary-title">Subsystem: Síntesis de Backend y Puente CASE XMI</text>
  </g>

  <!-- Actor: Ingeniero de Software -->
  <g id="actor-ingeniero-de-software">
    <!-- Cabeza -->
    <circle cx="120" cy="351" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="120" y1="362" x2="120" y2="392" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="102" y1="375" x2="138" y2="375" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="120" y1="392" x2="105" y2="414" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="120" y1="392" x2="135" y2="414" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="120" y="430" class="ea-actor-name">Ingeniero de Software</text>    <text x="120" y="443" class="ea-actor-role">Desarrollador / Arquitecto</text>
  </g>

  <!-- Actor: Motor Spring Boot 3 -->
  <g id="actor-motor-spring-boot-3">
    <!-- Cabeza -->
    <circle cx="1090" cy="211" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="1090" y1="222" x2="1090" y2="252" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="1072" y1="235" x2="1108" y2="235" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="1090" y1="252" x2="1075" y2="274" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="1090" y1="252" x2="1105" y2="274" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="1090" y="288" font-family="'Segoe UI', Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">«system»</text>    <text x="1090" y="300" class="ea-actor-name">Motor Spring Boot 3</text>    <text x="1090" y="313" class="ea-actor-role">Generador JPA / REST</text>
  </g>

  <!-- Actor: Enterprise Architect -->
  <g id="actor-enterprise-architect">
    <!-- Cabeza -->
    <circle cx="1090" cy="491" r="11" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Tronco -->
    <line x1="1090" y1="502" x2="1090" y2="532" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Brazos -->
    <line x1="1072" y1="515" x2="1108" y2="515" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Piernas -->
    <line x1="1090" y1="532" x2="1075" y2="554" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="1090" y1="532" x2="1105" y2="554" stroke="#2C3E50" stroke-width="1.5"/>
    <text x="1090" y="568" font-family="'Segoe UI', Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">«system»</text>    <text x="1090" y="580" class="ea-actor-name">Enterprise Architect</text>    <text x="1090" y="593" class="ea-actor-role">Herramienta CASE (XMI)</text>
  </g>

  <!-- Use Case: CU-21 Configurar Opciones de Backend -->
  <g id="uc-cu-21">
    <ellipse cx="430" cy="220" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="208" class="ea-uc-code">CU-21</text>
    <text x="430" y="224" class="ea-uc-name">Configurar Opciones de Backend</text>
    <text x="430" y="238" class="ea-uc-name">Grupo, Artefacto, BD y Puerto</text>
  </g>

  <!-- Use Case: CU-23 Exportar Diagrama a OMG XMI 2.1 -->
  <g id="uc-cu-23">
    <ellipse cx="430" cy="400" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="388" class="ea-uc-code">CU-23</text>
    <text x="430" y="404" class="ea-uc-name">Exportar Diagrama a OMG XMI 2.1</text>
    <text x="430" y="418" class="ea-uc-name">Generación Nativa para EA 15</text>
  </g>

  <!-- Use Case: CU-24 Importar Modelo desde XMI Externo -->
  <g id="uc-cu-24">
    <ellipse cx="430" cy="560" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="430" y="548" class="ea-uc-code">CU-24</text>
    <text x="430" y="564" class="ea-uc-name">Importar Modelo desde XMI Externo</text>
    <text x="430" y="578" class="ea-uc-name">Normalización de Tipos Primitivos</text>
  </g>

  <!-- Use Case: CU-22 Generar y Descargar ZIP -->
  <g id="uc-cu-22">
    <ellipse cx="770" cy="220" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="770" y="208" class="ea-uc-code">CU-22</text>
    <text x="770" y="224" class="ea-uc-name">Generar y Descargar ZIP</text>
    <text x="770" y="238" class="ea-uc-name">Entidades, Repositorios y Servicios</text>
  </g>

  <!-- Use Case: CU-25 Exportar Diagrama Vectorial -->
  <g id="uc-cu-25">
    <ellipse cx="770" cy="400" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="770" y="388" class="ea-uc-code">CU-25</text>
    <text x="770" y="404" class="ea-uc-name">Exportar Diagrama Vectorial</text>
    <text x="770" y="418" class="ea-uc-name">Descarga de Formatos SVG y PNG</text>
  </g>

  <!-- Use Case: CU-24b Calcular Autolayout Jerárquico -->
  <g id="uc-cu-24b">
    <ellipse cx="770" cy="560" rx="115" ry="29" fill="#EBF4FA" stroke="#2980B9" stroke-width="1.3"/>
    <text x="770" y="548" class="ea-uc-code">CU-24b</text>
    <text x="770" y="564" class="ea-uc-name">Calcular Autolayout Jerárquico</text>
    <text x="770" y="578" class="ea-uc-name">Disposición Sugiyama sin Solapes</text>
  </g>
  <line x1="145" y1="360" x2="315" y2="220" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="380" x2="315" y2="400" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="400" x2="315" y2="560" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="145" y1="390" x2="655" y2="400" stroke="#2C3E50" stroke-width="1.2"   />
  <line x1="545" y1="220" x2="655" y2="220" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <g>
    <rect x="559.25" y="211.0" width="81.5" height="18" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="600.0" y="224.0" class="ea-edge-label">«include»</text>
  </g>
  <line x1="545" y1="560" x2="655" y2="560" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <g>
    <rect x="563.0" y="551.0" width="74.0" height="18" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.8"/>
    <text x="600.0" y="564.0" class="ea-edge-label">«extend»</text>
  </g>
  <line x1="885" y1="220" x2="1065" y2="235" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="545" y1="410" x2="1065" y2="510" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>
  <line x1="545" y1="550" x2="1065" y2="530" stroke="#2C3E50" stroke-width="1.2" stroke-dasharray="5,4"  marker-end="url(#ea-open-arrow)"/>

  <!-- EA Note -->
  <g id="ea-note">
    <path d="M 860 40 L 1178 40 L 1190 52 L 1190 95 L 860 95 Z" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
    <path d="M 1178 40 L 1178 52 L 1190 52 Z" fill="#FFF59D" stroke="#F9A825" stroke-width="1"/>
    <text x="870" y="60" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Compatibilidad Total con EA 15 / 16 (ADR 0029):</text>
    <text x="870" y="76" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Exporta la extensión nativa &lt;diagrams&gt; y &lt;geometry&gt;.</text>
    <text x="870" y="92" font-family="'Segoe UI', Arial" font-size="10.5" fill="#37474F">Importa tipos Java y primitivos limpios sin UUIDs.</text>
  </g>

</svg>