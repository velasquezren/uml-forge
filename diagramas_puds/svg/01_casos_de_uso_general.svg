  <!-- Fondo Lienzo Blanco -->
  <rect width="1320" height="880" fill="#FFFFFF" />

  <!-- Marco Exterior de Diagrama Enterprise Architect -->
  <rect x="20" y="20" width="1280" height="840" fill="none" stroke="#708090" stroke-width="1.2" stroke-dasharray="none"/>

  <!-- Bloque de Título Oficial EA (Esquina superior izquierda ampliada) -->
