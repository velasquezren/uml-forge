# Nginx sirve la PWA compilada y hace de pasarela hacia la API, de modo que el
# navegador ve un unico origen: sin CORS y con la cookie de refresco valida.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El service worker no debe quedarse cacheado entre versiones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La generacion del backend devuelve un ZIP: sin buffer se entrega antes.
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
    }

    # Canal de colaboracion Yjs: requiere actualizar la conexion a WebSocket.
    location /collab {
        proxy_pass http://api:3000/collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # El resto lo resuelve el enrutador de la PWA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
