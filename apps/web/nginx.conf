# Nginx sirve la PWA compilada y hace de pasarela hacia la API, de modo que el
# navegador ve un unico origen: sin CORS y con la cookie de refresco valida.
#
# Es una plantilla: la imagen oficial de nginx sustituye ${API_UPSTREAM} y
# ${API_HOST} al arrancar. En Docker Compose apuntan al contenedor `api`; en
# Cloud Run, a la URL https del servicio de la API, que exige su propio Host y
# SNI para enrutar la peticion (ADR 0041).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El service worker no debe quedarse cacheado entre versiones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        # Las fotos de diagramas para la IA viajan en base64: nginx corta por
        # defecto en 1 MB. Mismo limite que el cuerpo JSON de la API.
        client_max_body_size 12m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ollama puede tardar hasta 180 segundos en responder en CPU.
        proxy_read_timeout 210s;
        # La generacion del backend devuelve un ZIP: sin buffer se entrega antes.
        proxy_buffering off;
    }

    location /health {
        proxy_pass ${API_UPSTREAM}/health;
        proxy_ssl_server_name on;
        proxy_set_header Host ${API_HOST};
    }

    # Canal de colaboracion Yjs: requiere actualizar la conexion a WebSocket.
    location /collab {
        proxy_pass ${API_UPSTREAM}/collab;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host ${API_HOST};
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # El resto lo resuelve el enrutador de la PWA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
