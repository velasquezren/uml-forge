name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

jobs:
  verify:
    name: Typecheck, lint, test y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umlforge
          POSTGRES_PASSWORD: umlforge
          POSTGRES_DB: umlforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umlforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://umlforge:umlforge@localhost:5432/umlforge?schema=public
      JWT_ACCESS_SECRET: ci_jwt_access_secret_key_32bytes_minimo
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_key_32bytes_minimo
      COOKIE_SECRET: ci_cookie_secret_key_32bytes_minimo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrar la base de datos de pruebas
        run: pnpm --filter @uml-forge/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  codegen-compile:
    name: Compilacion real de los proyectos Spring Boot generados
    runs-on: ubuntu-latest
    # Este trabajo se activa solo cuando existe el generador (Fase 6).
    if: hashFiles('packages/codegen-springboot/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar los seis modelos de prueba con Maven
        run: pnpm --filter @uml-forge/codegen-springboot test:maven

  e2e:
    name: Pruebas E2E de navegador con Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umlforge
          POSTGRES_PASSWORD: umlforge
          POSTGRES_DB: umlforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umlforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://umlforge:umlforge@localhost:5432/umlforge?schema=public
      JWT_ACCESS_SECRET: ci_jwt_access_secret_key_32bytes_minimo
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_key_32bytes_minimo
      COOKIE_SECRET: ci_cookie_secret_key_32bytes_minimo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Migrar la base de datos
        run: pnpm --filter @uml-forge/api exec prisma migrate deploy

      - name: Instalar el navegador
        run: pnpm --filter @uml-forge/web exec playwright install --with-deps chromium

      - name: Ejecutar la bateria E2E
        run: pnpm --filter @uml-forge/web test:e2e

      - name: Guardar el informe cuando algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
